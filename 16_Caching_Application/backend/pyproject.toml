[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-docs-assistant"
version = "0.1.0"
description = "A Python documentation assistant with RAG, agent capabilities, and semantic caching"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "openai>=1.3.0",
    "qdrant-client>=1.7.0",
    "redis>=5.0.0",
    "tavily-python>=0.3.1",
    "sentence-transformers>=2.2.0",
    "tiktoken>=0.5.2",
    "numpy>=1.26.0,<2",
    "pandas>=2.0.0",
    "PyPDF2>=3.0.0",
    "python-multipart>=0.0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["."] 